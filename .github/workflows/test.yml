name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests, including the privacy invariant
        run: python -W error -m unittest discover -s tests -v
      - name: Trend test on the published data
        run: python -I trend/trend.py trend/data/s5-2026-10-29_2026-11-15.csv
      - name: sfgeo.py is the deployed 0.1.2
        run: echo "cb11a2694ceaa06535206e9055dfcbe903afa6c08afd645702e5e83041092723  sfgeo.py" | sha256sum --check --strict
